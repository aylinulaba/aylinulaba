<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aylin Ulaba - Designer (Graphic, UI/UX) & UI Developer</title>
  <meta name="description" content="Working on it..." />
  <style>
    :root{
      --bg:#0e0f12;
      --fg:#e7e8ea;
      --fg-muted:#bfc3c8;
      --fg-hover:#ffffff;
    }
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:28px;
      text-align:center;
      padding:24px;
    }

    .title{
      font-size:clamp(12px, 2vw, 18px);
      font-weight:400;
      letter-spacing:.2px;
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap:.1ch;
      white-space:nowrap;
    }

    .dots{
      display:inline-flex;
      gap:.2ch;
      margin-left:.2ch;
    }
    .dot{
      width:.20em; height:.20em; border-radius:50%;
      background:currentColor; opacity:.2;
      animation: blink 1.4s infinite;
    }
    .dot:nth-child(1){ animation-delay:0s }
    .dot:nth-child(2){ animation-delay:.2s }
    .dot:nth-child(3){ animation-delay:.4s }

    @keyframes blink{
      0%,20% { opacity:.2; transform:translateY(0) }
      30%,50%{ opacity:1;  transform:translateY(-1px) }
      60%,100%{ opacity:.2; transform:translateY(0) }
    }

    @media (prefers-reduced-motion: reduce){
      .dot{ animation:none; opacity:.5 }
    }

    .social{
      display:flex; gap:12px;
    }
    .social a{
      display:inline-flex; align-items:center; justify-content:center;
      width:32px; height:32px; border-radius:8px;
      color:var(--fg-muted);
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      transition:transform .18s ease, color .18s ease, background .18s ease, border-color .18s ease;
      outline: none;
    }
    .social a:hover,
    .social a:focus-visible{
      color:var(--fg-hover);
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.14);
      transform:translateY(-2px);
    }
    .social svg{
      width:16px; height:16px; fill:currentColor;
    }

    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    footer{
      font-size:.9rem; color:var(--fg-muted);
    }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-label="Coming Soon">
    <h1 class="title">
      working on it
      <span aria-hidden="true" class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
      <span class="sr-only">working on it…</span>
    </h1>

</html>
